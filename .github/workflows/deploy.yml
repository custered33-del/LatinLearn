# Every push to main runs the tests and publishes the old GitHub Pages address,
# which now just forwards people to the app's new home on Vercel.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # The app itself now lives on Vercel (https://languagelearn-app.vercel.app, see vercel.json).
      # This old address only shows a "LanguageLearn has moved" page (moved/) that points there.
      - run: mkdir site && cp moved/* site/ && cp public/favicon.svg site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
